<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real weddings · Italian Event Planners</title>
<link rel="icon" href="brand/logo-brand.svg"><link rel="stylesheet" href="vendor/lenis.css?v=e2d7eba5"><link rel="stylesheet" href="css/site.css?v=7e1c513b"><link rel="stylesheet" href="css/v2.css?v=f826ce25"><link rel="stylesheet" href="css/story.css?v=f7d37526">
<meta name="robots" content="noindex"><script>try{if(sessionStorage.getItem("iep-arch")&&!matchMedia("(prefers-reduced-motion: reduce)").matches&&!location.search.includes("shot"))document.documentElement.classList.add("arch-ready")}catch(e){}</script></head>
<body class="v2 story-pg">
<div class="page" id="pg"></div>
<script src="js/stories.js?v=d94364f0"></script>
<script>
(() => {
  const S = window.STORIES, id = new URLSearchParams(location.search).get('s'), i = Math.max(0, S.findIndex(x => x.id === id)), s = S[i], nx = S[(i + 1) % S.length];
  document.title = s.title + ' · Italian Event Planners';
  const esc = t => t.replace(/&/g, '&amp;');
  document.getElementById('pg').innerHTML = `
  <header class="sx-open"><img src="img/g/${s.cover}.jpg" alt="${s.alt}"><div class="in"><p class="sx-kicker">${s.kicker}</p><h1 class="sx-title">${s.title}</h1><p class="sx-by">${esc(s.couple)}</p></div></header>
  <section class="sx-lede"><p>${s.lede}</p></section>
  ${s.chapters.map((c, k) => `<section class="sx-ch"><div class="sx-media">${c.steps.map((st, j) => `<img src="img/g/${st.img}.jpg" alt=""${j ? '' : ' class="on"'}>`).join('')}</div><div class="sx-text">${c.steps.map((st, j) => `<div class="sx-step${j ? '' : ' on'}" data-j="${j}"><img class="sx-pic" src="img/g/${st.img}.jpg" alt="">${st.n ? `<p class="sx-n">${st.n}</p>` : ''}${st.h ? `<h2>${st.h}</h2>` : ''}${st.p.map(x => `<p>${x}</p>`).join('')}</div>`).join('')}</div></section>${k === 0 && s.quote ? `<section class="sx-quote"><p>&ldquo;${s.quote[0]}&rdquo;</p><cite>${esc(s.quote[1])}</cite></section>` : ''}`).join('')}
  <section class="sx-facts"><h3>The details</h3><dl>${s.facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>${s.note ? `<p class="sx-note">${s.note}</p>` : ''}</section>
  <a class="sx-next" href="story.html?s=${nx.id}"><img src="img/g/${nx.cover}.jpg" alt=""><div class="in"><small>Next story</small><b>${nx.title}</b></div></a>
  <section class="sx-plan"><p>Yours could be next.</p><a href="plan.html">Start planning</a></section>`;
  // reveal: the step in view lights up and swaps the sticky photo
  const io = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) return; const st = e.target, ch = st.closest('.sx-ch'), j = +st.dataset.j;
    ch.querySelectorAll('.sx-step').forEach(x => x.classList.toggle('on', x === st)); ch.querySelectorAll('.sx-media img').forEach((im, k) => im.classList.toggle('on', k === j)); }), {rootMargin: '-45% 0px -45% 0px'});
  document.querySelectorAll('.sx-step').forEach(x => io.observe(x));
  if (location.search.includes('shot')) { document.querySelectorAll('.sx-step').forEach(x => x.classList.add('on')); document.querySelectorAll('.sx-ch').forEach(c => c.classList.add('flat')); }
})();
</script>
<script src="js/site.js?v=c05b93b2"></script>
<script src="vendor/gsap.min.js?v=ff86cb55"></script><script src="vendor/ScrollTrigger.min.js?v=2e3b8c36"></script><script src="vendor/lenis.min.js?v=5a44a112"></script><script src="js/motion.js?v=ef56d6a3"></script>
</body>
</html>
